spring:
  application:
    name: retoday-api
  main:
    banner-mode: off
  profiles:
    include:
    - auth
    - db
    - ai
server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
management:
  server:
    port: 8081
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health,prometheus
    jmx:
      exposure:
        exclude: '*'
  endpoint:
    health:
      access: read_only
      probes:
        enabled: true
        add-additional-paths: true
    prometheus:
      access: read_only
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
logging:
  config: classpath:log4j2-${spring.profiles.active}.yaml
---
spring:
  config:
    activate:
      on-profile: local
frontend:
  uris: http://localhost:3000
---
spring:
  config:
    activate:
      on-profile: dev
frontend:
  uris: ${WEB_URI},${EXTENSION_URI}
---
spring:
  config:
    activate:
      on-profile: prod
  web:
    resources:
      add-mappings: false
frontend:
  uris: ${WEB_URI},${EXTENSION_URI}
