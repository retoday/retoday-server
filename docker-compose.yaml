services:
  mysql:
    image: mysql:8.0
    container_name: retoday-mysql
    restart: unless-stopped
    ports:
    - "3306:3306"
    environment:
      MYSQL_DATABASE: retoday
      MYSQL_ROOT_PASSWORD: root
      TZ: UTC
    command:
    - --default-time-zone=+00:00
    volumes:
    - mysql:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-proot" ]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    container_name: retoday-redis
    restart: unless-stopped
    ports:
    - "6379:6379"
    command: redis-server --port 6379 --requirepass root
    volumes:
    - redis:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "root", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: retoday-prometheus
    restart: unless-stopped
    ports:
    - "9091:9090"
    entrypoint: [ "/bin/sh", "-c" ]
    command:
    - |
      cat <<EOF >/etc/prometheus/prometheus.yaml
      global:
        scrape_interval: 15s
      scrape_configs:
      - job_name: 'spring'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: [ 'host.docker.internal:8081' ]
      EOF

      /bin/prometheus \
        --config.file=/etc/prometheus/prometheus.yaml \
        --storage.tsdb.path=/prometheus \
        --web.enable-lifecycle
    volumes:
    - prometheus:/prometheus
    extra_hosts:
    - "host.docker.internal:host-gateway"
  grafana:
    image: grafana/grafana:11.4.0
    container_name: retoday-grafana
    restart: unless-stopped
    ports:
    - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: root
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
    - grafana:/var/lib/grafana
    depends_on:
    - prometheus
volumes:
  mysql:
  redis:
  prometheus:
  grafana:
