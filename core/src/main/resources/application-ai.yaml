spring:
  ai:
    bedrock:
      aws:
        region: ${AWS_BEDROCK_REGION}
      converse:
        chat:
          options:
            model: ${AWS_BEDROCK_MODEL}
            temperature: 0.7
            max-tokens: ${AWS_BEDROCK_MAX_TOKENS}
    google:
      genai:
        api-key: ${GOOGLE_GEMINI_API_KEY}
        chat:
          options:
            model: ${GOOGLE_GEMINI_MODEL}
            response-mime-type: application/json
            temperature: 0.7
