spring:
  ai:
    bedrock:
      aws:
        # AWS SDK resolves AWS_BEARER_TOKEN_BEDROCK directly from the environment.
        region: ${AWS_BEDROCK_REGION:ap-northeast-1}
      converse:
        chat:
          options:
            model: ${AWS_BEDROCK_MODEL:amazon.nova-lite-v1:0}
            temperature: 0.7
            max-tokens: ${AWS_BEDROCK_MAX_TOKENS:4096}
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: ${GEMINI_MODEL}
            response-mime-type: application/json
            temperature: 0.7
