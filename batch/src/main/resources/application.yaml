spring:
  application:
    name: retoday-batch
  main:
    banner-mode: off
  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false
  profiles:
    include:
    - auth
    - db
    - ai
server:
  port: 8080
management:
  server:
    port: 8081
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      access: read_only
      probes:
        enabled: true
        add-additional-paths: true
    prometheus:
      access: read_only
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
logging:
  config: classpath:log4j2-${spring.profiles.active}.yaml
retoday:
  recap:
    batch:
      enqueue-kst-cron: "0 0 0 * * *"
      enqueue-pacific-cron: "0 0 0 * * *"
    worker:
      fixed-delay: 10000
      parallelism: 2
---
spring:
  config:
    activate:
      on-profile: local
---
spring:
  config:
    activate:
      on-profile: dev
---
spring:
  config:
    activate:
      on-profile: prod
