name: Review code with Gemini
on:
  pull_request:
    branches:
    - dev
    types:
    - opened
  workflow_dispatch:
jobs:
  code-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20
    - name: Install Google AI
      run: npm install @google/generative-ai
    - name: Get git diff for PR
      run: |
        git fetch origin "${{ github.event.pull_request.base.ref }}"
        git fetch origin "${{ github.event.pull_request.head.ref }}"
        git diff "origin/${{ github.event.pull_request.base.ref }}"..."origin/${{ github.event.pull_request.head.ref }}" > diff.txt
    - name: Review code
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        node .github/scripts/review-code.js
    - name: Comment on Pull Request
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require("fs");
          const body = fs.readFileSync("review_result.txt", "utf8");

          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: body
          });
